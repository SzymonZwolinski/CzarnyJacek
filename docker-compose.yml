version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: casino_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  spark-app:
    build: .
    volumes:
      - .:/app
    depends_on:
      - db
    ports:
      - "8501:8501"

    command: tail -f /dev/null